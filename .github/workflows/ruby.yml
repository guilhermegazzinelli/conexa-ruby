name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Matches conexa.gemspec's required_ruby_version and the SUPPORTED_RUBIES list
  # in the Rakefile. `rake spec:all` runs the same matrix locally.
  test:
    name: specs (ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      # bundler-cache resolves and caches per ruby version. The gem does not
      # commit Gemfile.lock, so each version resolves the range the gemspec
      # actually allows instead of a single pinned set.
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec --format documentation

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Offences predating .rubocop_todo.yml are grandfathered there, so this is
      # a real gate on new code rather than a permanently-red advisory step.
      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit

      # Advisory: a new CVE in a transitive dependency should surface, but it
      # should not block an unrelated pull request.
      - name: Run security audit
        run: bundle-audit check --update
        continue-on-error: true
